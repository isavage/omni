name: Deploy OmniRoute to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild without cache"
        required: false
        type: boolean
        default: false
      cleanup:
        description: "Prune unused images"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod-IN
    steps:
      - uses: actions/checkout@v4
      - uses: isavage/deploy@v3
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          compose_file: docker-compose.yml
          no_cache: ${{ inputs.no_cache || false }}
          cleanup: ${{ inputs.cleanup || false }}
